name: edwardsrt
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  
  shimmer: ^3.0.0
  file_picker: ^10.3.3
  
  mobile_scanner: ^7.1.3
  shared_preferences: ^2.5.3
  http: ^1.5.0
  logger: ^2.6.2
  
  
  google_fonts: ^6.3.2
  chewie: ^1.13.0
  video_player: ^2.10.1
  
  cached_network_image: ^3.4.1
  flutter_easyloading: ^3.0.5
  
  just_audio: ^0.10.5
  
  
  youtube_player_flutter: ^9.1.3


  flutter_localizations:
    sdk: flutter 
  url_launcher: ^6.3.2
  wakelock_plus: ^1.4.0
  
 

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_logo.png"
  remove_alpha_ios: true




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true # For l10n generation

  # Assets for the app
  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
